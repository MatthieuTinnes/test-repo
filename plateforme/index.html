<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plateforme</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrapper">
    <div class="hud" aria-live="polite">
      <span>Niveau : <strong id="level">1/3</strong></span>
      <span>Score : <strong id="score">0</strong></span>
      <span>Vies : <strong id="lives">3</strong></span>
    </div>

    <div class="stage">
      <canvas id="game" width="480" height="384" role="img" aria-label="Jeu de plateforme : ramassez les pièces, évitez les ennemis et atteignez le drapeau."></canvas>

      <section id="screen-start" class="overlay" aria-labelledby="start-title">
        <h1 id="start-title">Plateforme</h1>
        <p>Flèches gauche et droite : se déplacer. Espace ou flèche haut : sauter.</p>
        <p>Écrasez les ennemis par le haut. Atteignez le drapeau.</p>
        <p>Entrée : démarrer.</p>
        <button id="btn-start" class="primary" type="button">Jouer</button>
      </section>

      <section id="screen-end" class="overlay hidden" aria-labelledby="end-title" aria-live="assertive">
        <h2 id="end-title">Partie terminée</h2>
        <p id="end-text"></p>
        <p>Score final : <strong id="final-score">0</strong></p>
        <p>Entrée : rejouer depuis le niveau 1.</p>
        <button id="btn-retry" class="primary" type="button">Rejouer</button>
      </section>
    </div>

    <div class="touch" aria-label="Commandes tactiles">
      <button type="button" data-action="left" aria-label="Aller à gauche">◀</button>
      <button type="button" data-action="jump" aria-label="Sauter">▲</button>
      <button type="button" data-action="right" aria-label="Aller à droite">▶</button>
    </div>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
